name: sync-and-deploy

on:
  schedule:
    - cron: "17 3 * * *"        # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      satellites:
        description: "Crawl the satellite documents too"
        type: boolean
        default: true
      linkcheck:
        description: "How many links to health-check this run"
        default: "300"
  push:
    branches: [main]
    paths: ["tools/**", "data/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the database and satellite cache
        uses: actions/cache@v4
        with:
          path: |
            build/mazda.db
            .cache
          key: mazda-state-${{ github.run_id }}
          restore-keys: mazda-state-

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Sync the document and build the site
        run: |
          python3 tools/pipeline.py --live \
            ${{ github.event.inputs.satellites == 'false' && '--no-satellites' || '' }} \
            --linkcheck ${{ github.event.inputs.linkcheck || 300 }}

      - name: Summarize the run
        run: |
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          run = json.load(open("build/run.json"))
          data = json.load(open("build/data.json"))
          s = data["stats"]
          print(f"### Sync results\n")
          print(f"- doc sha `{data['sha'][:16]}`")
          print(f"- {s['topics']} topics across {s['docs']} documents, {s['sources']} sources")
          print(f"- {len(run['changes'])} changes, {len(run['errors'])} satellite errors\n")
          for c in run["changes"][:40]:
              print(f"- **{c['entity']}** {c['field']}: {c.get('label') or c['id']} "
                    f"({c.get('before')} → {c.get('after')})")
          PY

      - name: Commit the refreshed dataset
        run: |
          git config user.name  "mazda-docs bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f build/data.json build/snapshot.sha build/run.json build/mazda.db
          git diff --cached --quiet || git commit -m "sync: $(date -u +%Y-%m-%d) — $(python3 -c "import json;print(len(json.load(open('build/run.json'))['changes']))") changes"
          git push || echo "nothing to push"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
